<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="VALL AI">
  <title>VALL AI</title>
  <defs>
    <linearGradient id="rb-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8ae4"/>
      <stop offset="1" stop-color="#1f56c9"/>
    </linearGradient>
    <linearGradient id="rb-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2436"/>
      <stop offset="1" stop-color="#193249"/>
    </linearGradient>
  </defs>

  <!-- Antena -->
  <line x1="64" y1="10" x2="64" y2="24" stroke="#1f56c9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="9" r="6" fill="#1baf7a"/>

  <!-- Cabeza -->
  <rect x="20" y="22" width="88" height="70" rx="20" fill="url(#rb-body)"/>
  <!-- Orejas / laterales -->
  <rect x="10" y="46" width="10" height="24" rx="5" fill="#1f56c9"/>
  <rect x="108" y="46" width="10" height="24" rx="5" fill="#1f56c9"/>

  <!-- Visor -->
  <rect x="31" y="35" width="66" height="42" rx="15" fill="url(#rb-face)"/>
  <!-- Ojos -->
  <circle cx="52" cy="55" r="7.5" fill="#ffffff"/>
  <circle cx="76" cy="55" r="7.5" fill="#ffffff"/>
  <circle cx="53.5" cy="56.5" r="3" fill="#0f2436"/>
  <circle cx="77.5" cy="56.5" r="3" fill="#0f2436"/>
  <!-- Sonrisa -->
  <path d="M54 68 Q64 74 74 68" stroke="#1baf7a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Cuello y hombros -->
  <rect x="56" y="92" width="16" height="8" fill="#1f56c9"/>
  <path d="M28 122 Q28 102 50 100 L78 100 Q100 102 100 122 Z" fill="url(#rb-body)"/>
  <!-- Detalle del pecho -->
  <circle cx="64" cy="112" r="6" fill="#0f2436" opacity=".28"/>
</svg>
